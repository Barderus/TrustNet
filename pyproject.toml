[project]
name = "trustnet"
version = "0.1.0"
description = "TrustNet is a misinformation analysis project focused on fake-news detection and stance detection."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.9.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "scikit-learn>=1.5.0",
    "seaborn>=0.13.0",
    "shap>=0.46.0",
    "spacy>=3.8.7",
    "streamlit>=1.44.0",
    "torch>=2.6.0",
    "transformers>=4.50.0",
    "transformers-interpret>=0.10.0",
    "tqdm>=4.67.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]
