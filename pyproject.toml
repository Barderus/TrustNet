[project]
name = "trustnet"
version = "0.1.0"
description = "TrustNet is a misinformation analysis project focused on fake-news detection and stance detection."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.1.0",
    "contractions>=0.1.73",
    "matplotlib>=3.9.0",
    "nltk>=3.9.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "pdfplumber>=0.11.0",
    "plotly>=6.0.0",
    "python-docx>=1.1.0",
    "scikit-learn>=1.5.0",
    "seaborn>=0.13.0",
    "shap>=0.46.0",
    "spacy>=3.8.7",
    "streamlit>=1.44.0",
    "textblob>=0.19.0",
    "textstat>=0.7.4",
    "torch>=2.6.0",
    "transformers>=4.50.0",
    "transformers-interpret>=0.10.0",
    "tqdm>=4.67.0",
    "wordcloud>=1.9.4",
    "ipykernel>=7.2.0",
    "nbformat>=5.10.4",
    "en-core-web-sm>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
